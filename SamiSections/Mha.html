<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página personal de Sami y ya, no se que mas decir :p "
    />

    <title>Página de Sami</title>
    <link rel="icon" type="image/png" href="../images/contenent/Logotipo.png" />

    <link rel="stylesheet" href="../Css/Style.css" />

    <style>
      body {
        background-image: url("../images/contenent/Fondos/Cielo\ y\ pasto.webp");
        max-width: 1200px;
      }

      h1 {
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        color: rgb(206, 40, 153);
        border: 10px solid rgba(111, 92, 239, 0.78);
      }

      /* La cuadrícula coloca dos tarjetas por fila en pantallas grandes. */
      main {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: start;
        gap: 18px;
        margin-top: 28px;
      }

      .oc-card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
        border: 4px solid rgba(111, 92, 239, 0.78);
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.94);
        box-shadow: 0 5px 12px rgba(47, 35, 85, 0.2);
      }

      /* Todas las imagenes tienen la misma altura para mantener el orden visual. */
      .oc-card__image {
        width: 100%;
        height: 260px;
        object-fit: cover;
        border-radius: 0;
        box-shadow: none;
      }

      .oc-card__content {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 18px;
      }

      .oc-card__title {
        margin: 0 0 6px;
        color: rgb(111, 92, 239);
        font-size: 1.7rem;
      }

      .oc-card__toggle {
        width: 100%;
        margin-top: auto;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background-color: rgb(111, 92, 239);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: bold;
      }

      .oc-card__toggle:hover,
      .oc-card__toggle:focus-visible {
        background-color: rgb(86, 67, 204);
      }

      /* Los detalles solo ocupan espacio cuando JavaScript quita el atributo hidden. */
      .oc-card__details {
        margin: 16px 0;
        color: rgb(55, 55, 55);
        line-height: 1.5;
      }

      .oc-card__details[hidden] {
        display: none;
      }

      .oc-card__details h3 {
        margin: 14px 0 4px;
        color: rgb(206, 40, 153);
        font-size: 1rem;
      }

      .oc-card__section {
        margin-top: 10px;
        border-top: 2px solid rgba(111, 92, 239, 0.25);
      }

      .oc-card__section-toggle {
        width: 100%;
        padding: 10px 0;
        border: 0;
        background: transparent;
        color: rgb(206, 40, 153);
        cursor: pointer;
        font: inherit;
        font-weight: bold;
        text-align: left;
      }

      .oc-card__section-toggle:hover,
      .oc-card__section-toggle:focus-visible {
        color: rgb(111, 92, 239);
      }

      .oc-card__section-content[hidden] {
        display: none;
      }

      .oc-card__details p {
        margin: 0;
      }

      .oc-card__details ul {
        margin: 6px 0 0;
        padding-left: 20px;
      }

      /* En pantallas medianas usamos dos columnas para que el texto respire. */
      @media (max-width: 760px) {
        main {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* En moviles dejamos una tarjeta por fila. */
      @media (max-width: 520px) {
        main {
          grid-template-columns: 1fr;
        }

        .oc-card__image {
          height: 300px;
        }
      }
    </style>
  </head>
  <a href="OcsDeSami.html">
    <header>
      <h1>Página de Sami <3</h1>
    </header>
  </a>

  <main></main>
  <script src="Mha.js" defer></script>
</html>
